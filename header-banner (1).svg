  <!-- Prompt top -->
  <text class="fade fn sm" x="50" y="42">~/ashutosh7484 $  git status</text>
  <text class="fade fn" x="50" y="60" font-family="'Courier New',monospace" font-size="11" fill="#00cc33" opacity="0.5">On branch main — everything up to date</text>

  <!-- Name -->
