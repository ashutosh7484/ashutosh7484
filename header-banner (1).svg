<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <style>
      .fn { font-family: 'Courier New', monospace; }
      .nm { font-family: 'Courier New', monospace; font-size: 40px; font-weight: 700; fill: #00ff41; }
      .sb { font-family: 'Courier New', monospace; font-size: 14px; fill: #00cc33; letter-spacing: 1px; }
      .sm { font-family: 'Courier New', monospace; font-size: 12px; fill: #00ff41; opacity: 0.6; }
      .cur { animation: blink 1s step-end infinite; fill: #00ff41; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .rain { animation: rain linear infinite; fill: #00ff41; }
      @keyframes rain {
        from { transform: translateY(-20px); opacity: 0; }
        10%  { opacity: 0.7; }
        90%  { opacity: 0.3; }
        to   { transform: translateY(240px); opacity: 0; }
      }
      .r1  { animation-duration: 3s;   animation-delay: 0s;   }
      .r2  { animation-duration: 4.5s; animation-delay: 0.7s; }
      .r3  { animation-duration: 3.8s; animation-delay: 1.4s; }
      .r4  { animation-duration: 5s;   animation-delay: 0.3s; }
      .r5  { animation-duration: 3.2s; animation-delay: 2s;   }
      .r6  { animation-duration: 4.2s; animation-delay: 1.1s; }
      .r7  { animation-duration: 3.6s; animation-delay: 0.5s; }
      .r8  { animation-duration: 4.8s; animation-delay: 1.8s; }
      .r9  { animation-duration: 3.4s; animation-delay: 2.5s; }
      .r10 { animation-duration: 5.2s; animation-delay: 0.9s; }
      .r11 { animation-duration: 3.9s; animation-delay: 1.6s; }
      .r12 { animation-duration: 4.4s; animation-delay: 0.2s; }
      .fade  { animation: fadeIn 1.2s ease forwards; opacity: 0; }
      .fade2 { animation: fadeIn 1.2s 0.5s ease forwards; opacity: 0; }
      .fade3 { animation: fadeIn 1.2s 1s ease forwards; opacity: 0; }
      @keyframes fadeIn { to { opacity: 1; } }
      .scan { animation: scanLine 4s ease-in-out infinite alternate; }
      @keyframes scanLine {
        from { transform: translateX(-900px); opacity: 0.15; }
        to   { transform: translateX(900px);  opacity: 0.15; }
      }
    </style>
  </defs>

  <rect width="900" height="220" fill="#020d02"/>
  <rect width="900" height="220" fill="#001a00" opacity="0.6"/>

